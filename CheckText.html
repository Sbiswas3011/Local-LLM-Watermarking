<!DOCTYPE html>
<html>
<head>
    <title>LLM Stream</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
        }

        #prompt {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            min-height: 200px;
            white-space: pre-wrap;
        }

        .stats {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>Local LLM</h2>

    <input
        id="prompt"
        type="text"
        placeholder="Enter your prompt..."
    >

    <button onclick="sendPrompt()">Send</button>

    <div id="output"></div>

    <div class="stats">
        <p>Green Tokens: <span id="green">0</span></p>
        <p>Total Tokens: <span id="total">0</span></p>
    </div>

    <script>
        const output = document.getElementById("output");
        const green = document.getElementById("green");
        const total = document.getElementById("total");

        const ws = new WebSocket("ws://localhost:8080/ws");

        ws.onopen = () => {
            console.log("Connected to server");
        };

        ws.onmessage = (event) => {
            const result = JSON.parse(event.data);

            // Add generated token
            output.textContent += result.token;

            // Update statistics
            green.textContent = result.green_count;
            total.textContent = result.total_count;
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
        };

        ws.onclose = () => {
            console.log("WebSocket closed");
        };

        function sendPrompt() {
            const prompt = document.getElementById("prompt").value;

            if (prompt.trim() === "") {
                return;
            }

            // Clear previous response
            output.textContent = "";

            // Reset counters
            green.textContent = "0";
            total.textContent = "0";

            ws.send(JSON.stringify({
                type: "generate",
                text: prompt,
                watermark: true
            }));
        }
    </script>

</body>
</html>
