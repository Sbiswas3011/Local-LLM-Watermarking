<meta name="viewport" content="width=device-width, initial-scale=1">

<script>

function makeID() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function getSessionID() {
    let id = null;
    try {
        id = localStorage.getItem("session_id");
    } catch (e) {}
    if (!id) {
        id = makeID();
        try {
            localStorage.setItem("session_id", id);
        } catch (e) {}
    }
    return id;
}

async function run() {
    const text = document.getElementById("text").value;
    const mode = document.querySelector(
        'input[name="mode"]:checked'
    ).value;
    document.getElementById("result").textContent = "";
    document.getElementById("green_count").textContent = "0";
    document.getElementById("total_count").textContent = "0";
    document.getElementById("z_score").textContent = "0.00";
    document.getElementById("tokens_spent").textContent = "";
    document.getElementById("total_avaialble_tokens").textContent = "";
    document.getElementById("total_per_sec").textContent = "0.00";

    const sessionID = getSessionID();

    if (mode === "generate") {
        // const ws = new WebSocket("ws://localhost:8080/ws");

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws?session_id=${sessionID}`);

        ws.onopen = () => {
            ws.send(JSON.stringify({
                type: "placeholder",
                text: text,
                watermark: document.getElementById("watermark").checked,
                logit_bias: parseFloat(document.getElementById("logit_bias").value) || 0,
                gamma: parseFloat(document.getElementById("gamma").value) || 0,
                history_size: parseInt(document.getElementById("history").value) || 0,
                seed: document.getElementById("seed").value
            }));
        };

        ws.onmessage = (event) => {
            const result = JSON.parse(event.data);

            // Your Go TokenResult
            document.getElementById("result").textContent += result.Token;

            // console.log("Green:", result.green_count);
            // console.log("Total:", result.green_count);
            // console.log("ZScore:", result.z_score.toFixed(2))

            document.getElementById("green_count").textContent = result.GreenCount;
            document.getElementById("total_count").textContent = result.TotalCount;
            document.getElementById("z_score").textContent = result.ZScore.toFixed(2);
            document.getElementById("tokens_spent").textContent = result.ContextUsed;
            document.getElementById("total_avaialble_tokens").textContent = result.TotalContext;
            document.getElementById("total_per_sec").textContent = result.TokensPerSecond;
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
        };

        ws.onclose = () => {
            console.log("WebSocket closed");
        };
    }

    if (mode === "watermark") {
        const response = await fetch("/process", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: text,
                seed: document.getElementById("seed").value,
                gamma: parseFloat(document.getElementById("gamma").value) || 0,
                history_size: parseInt(document.getElementById("history").value) || 0
            })
        });

        const result = await response.json();

        // document.getElementById("result").textContent =
        //     JSON.stringify(result, null, 2);

        document.getElementById("green_count").textContent = result.green_count;
        document.getElementById("total_count").textContent = result.total_count;
        document.getElementById("z_score").textContent = result.z_score.toFixed(2);
        document.getElementById("tokens_spent").textContent = result.tokens_spent;
        document.getElementById("total_avaialble_tokens").textContent = result.total_avaialble_tokens;
        document.getElementById("total_per_sec").textContent = result.TokensPerSecond;
    }
}

async function reset() {
    document.getElementById("result").textContent = "";
    document.getElementById("green_count").textContent = "0";
    document.getElementById("total_count").textContent = "0";
    document.getElementById("z_score").textContent = "0.00";
    document.getElementById("tokens_spent").textContent = "";
    document.getElementById("total_avaialble_tokens").textContent = "";
    document.getElementById("total_per_sec").textContent = "0.00";

    const sessionID = getSessionID();

    const response = await fetch(`/resetctx?session_id=${encodeURIComponent(sessionID)}`, {
        method: "GET",
    });

    const result = await response.json();
    document.getElementById("result").textContent += result.success;
}

</script>

<textarea id="text"
    placeholder="Enter prompt or text..."></textarea>

<label>
    <input type="radio" name="mode" value="generate" checked>
    Generate
</label>

<label>
    <input type="radio" name="mode" value="watermark">
    Test Watermark
</label>

<br><br>

<label>Seed:</label>
<input id="seed" value="i_am_a_llm">

<label>History:</label>
<input id="history" type="number" value="4" step="1">

<label>Gamma:</label>
<input id="gamma" type="number" value="0.6" step="0.1">

<label>LogitBias:</label>
<input id="logit_bias" type="number" value="4.0" step="0.1">

<label>
    <input id="watermark" type="checkbox">
    Watermark For Generation
</label>

<br><br>

<button onclick="run()">Run</button>
<button onclick="reset()">Reset</button>

<pre id="result"></pre>

<script>
document.getElementById("text").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        run();
    }
});
</script>

<div id="stats">
    <span>Green: <b id="green_count">0</b></span>
    <span>Total: <b id="total_count">0</b></span>
    <span>Z-Score: <b id="z_score">0.00</b></span>
    <span>Tokens_Spent: <b id="tokens_spent">0.00</b></span>
    <span>Tokens_Available: <b id="total_avaialble_tokens">0.00</b></span>
    <span>Tokens/Sec: <b id="total_per_sec">0.00</b></span>
</div>
